name: Build & Release

on:
    push:
        branches: ["*"]
    pull_request:
        branches: ["*"]
    release:
        types: [published, created]

jobs:
    build:
        name: Build ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                include:
                    - os: windows-latest
                      name: windows-amd64
                      goarch: amd64
                    - os: ubuntu-latest
                      name: linux-amd64
                      goarch: amd64
                    - os: macos-latest
                      name: macos-arm64
                      goarch: arm64
                    - os: macos-latest
                      name: macos-amd64
                      goarch: amd64
            fail-fast: false

        steps:
            - name: Checkout code
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: "stable"
                  check-latest: true

            - name: Install Dependencies (Linux)
              if: runner.os == 'Linux'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libgtk-3-dev

            - name: Set output filename
              id: vars
              shell: bash
              run: |
                  if [ "${{ matrix.os }}" = "windows-latest" ]; then
                    echo "filename=puush-${{ matrix.name }}.exe" >> $GITHUB_OUTPUT
                  else
                    echo "filename=puush-${{ matrix.name }}" >> $GITHUB_OUTPUT
                  fi

            - name: Set build metadata
              id: metadata
              shell: bash
              run: |
                  echo "build=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
                  echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

            - name: Generate Windows icon resource
              if: runner.os == 'Windows'
              working-directory: cmd/desktop
              shell: bash
              run: |
                  go run github.com/josephspurrier/goversioninfo/cmd/goversioninfo@v1.7.0 \
                    -skip-versioninfo \
                    -icon=../../assets/icons/icon.ico \
                    -64 \
                    -o=resource_windows_amd64.syso

            - name: Build
              env:
                  GOARCH: ${{ matrix.goarch }}
                  CGO_ENABLED: 1
                  MACOSX_DEPLOYMENT_TARGET: "10.13"
                  APP_BUILD: ${{ steps.metadata.outputs.build }}
                  APP_COMMIT: ${{ steps.metadata.outputs.commit }}
              shell: bash
              run: |
                  mkdir -p build
                  ldflags="-s -X main.AppBuild=$APP_BUILD -X main.AppCommit=$APP_COMMIT"
                  if [ "$RUNNER_OS" = "Windows" ]; then
                    ldflags="$ldflags -H=windowsgui"
                  fi

                  go build \
                    -trimpath \
                    -buildvcs=false \
                    -tags no_emoji \
                    -ldflags="$ldflags" \
                    -o build/${{ steps.vars.outputs.filename }} \
                    ./cmd/desktop

            - name: Upload Artifact
              if: github.event_name != 'release'
              uses: actions/upload-artifact@v7
              with:
                  name: puush-${{ matrix.name }}
                  path: build/${{ steps.vars.outputs.filename }}
                  retention-days: 7

            - name: Upload Release Asset
              if: github.event_name == 'release'
              uses: softprops/action-gh-release@v3
              with:
                  files: build/${{ steps.vars.outputs.filename }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
